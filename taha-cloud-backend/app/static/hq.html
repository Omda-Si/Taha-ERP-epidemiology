<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taha HQ Epidemiology</title>
  <style>
    :root { --bg:#10231c; --card:#163027; --ink:#e7fff4; --muted:#9ad4bb; --line:#1c3d30; --accent:#0f8f6a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI",sans-serif; background:linear-gradient(180deg,#0b1813,#10231c); color:var(--ink); }
    header, main { width:min(1100px, calc(100% - 32px)); margin:0 auto; }
    header { display:flex; justify-content:space-between; align-items:end; padding:28px 0 12px; }
    .eyebrow { color:var(--accent); letter-spacing:.12em; text-transform:uppercase; font-size:12px; margin:0; }
    h1 { margin:6px 0 0; }
    .sub { color:var(--muted); }
    .pill { background:#1c3d30; color:#d7ffe9; border-radius:999px; padding:8px 14px; font-weight:700; }
    .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:16px 0; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
    .card strong { display:block; font-size:28px; margin-top:8px; }
    table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
    th, td { text-align:left; padding:12px 10px; border-bottom:1px solid var(--line); font-size:14px; }
    th { color:var(--muted); font-weight:700; }
    @media (max-width:800px){ .cards{grid-template-columns:1fr 1fr;} }
  </style>
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">Taha Group</p>
      <h1>HQ Epidemiology</h1>
      <p class="sub">Anonymized cases from clinic apps · no patient names</p>
    </div>
    <div class="pill" id="status">Loading…</div>
  </header>
  <main>
    <div class="cards" id="cards"></div>
    <table>
      <thead>
        <tr>
          <th>When</th>
          <th>Facility</th>
          <th>Disease</th>
          <th>Age</th>
          <th>Occupation</th>
          <th>Location</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script>
    async function load() {
      const data = await (await fetch('/api/v1/epidemiology/cases')).json();
      const cases = data.cases || [];
      document.getElementById('status').textContent = `${cases.length} cases`;
      const byDisease = {};
      const byRegion = {};
      for (const c of cases) {
        byDisease[c.diagnosis_name] = (byDisease[c.diagnosis_name] || 0) + 1;
        byRegion[c.region] = (byRegion[c.region] || 0) + 1;
      }
      document.getElementById('cards').innerHTML = `
        <div class="card">Total cases<strong>${cases.length}</strong></div>
        <div class="card">Diseases<strong>${Object.keys(byDisease).length}</strong></div>
        <div class="card">Regions<strong>${Object.keys(byRegion).length}</strong></div>
        <div class="card">Top disease<strong>${Object.entries(byDisease).sort((a,b)=>b[1]-a[1])[0]?.[0] || '—'}</strong></div>
      `;
      document.getElementById('rows').innerHTML = cases.map(c => `
        <tr>
          <td>${c.diagnosed_at}</td>
          <td>${c.facility_code}</td>
          <td>${c.diagnosis_name} (${c.diagnosis_code})</td>
          <td>${c.age_bracket}</td>
          <td>${c.occupation}</td>
          <td>${c.city || ''}, ${c.region}</td>
        </tr>
      `).join('') || `<tr><td colspan="6">No cases yet. Save a diagnosis in Taha Clinic.</td></tr>`;
    }
    load();
    setInterval(load, 8000);
  </script>
</body>
</html>
